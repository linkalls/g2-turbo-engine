plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.poteto.g2turbo'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.poteto.g2turbo'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-poc'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Public experimental APK only; the debug key is not a stable release key.
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path file('../native/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
