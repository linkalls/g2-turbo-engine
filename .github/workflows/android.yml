name: Public Android benchmark APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and upload arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install             'platforms;android-35'             'build-tools;35.0.0'             'ndk;27.2.12479018'             'cmake;3.22.1'

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check reference and optimized kernels on host
        run: |
          cmake -S native -B /tmp/g2-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/g2-native -j 2
          /tmp/g2-native/g2-kernel-bench 256 512 6 | tee /tmp/g2-host-test.json
          grep -F '"pass": true' /tmp/g2-host-test.json

      - name: Validate experimental Vulkan shader (syntax only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          glslangValidator -V -S comp             native/shaders/q4_0_gemv.comp -o /tmp/q4_0_gemv.spv

      - name: Compile Android APK with ARM SDOT
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Inspect final Android APK
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libg2turbo.so'
          test -n "$(unzip -p "$APK" 'lib/arm64-v8a/libg2turbo.so' | wc -c)"
          mkdir -p dist
          cp "$APK" dist/g2-turbo-kernel-bench.apk
          sha256sum dist/g2-turbo-kernel-bench.apk > dist/SHA256SUMS.txt

      - name: Upload APK to public Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: g2-turbo-kernel-bench-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
