name: Public Android benchmark APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and upload arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Host CPU numerical regression
        run: |
          cmake -S native -B /tmp/g2-native -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/g2-native -j 2
          /tmp/g2-native/g2-kernel-bench 256 512 6 | tee /tmp/g2-host-test.json
          grep -F '"pass": true' /tmp/g2-host-test.json
          /tmp/g2-native/g2-kernel-bench 1536 1536 3 | tee /tmp/g2-large-test.json
          grep -F '"pass": true' /tmp/g2-large-test.json

      - name: Compile Vulkan shader to Android asset
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools spirv-tools
          mkdir -p app/src/main/assets/shaders
          for variant in q4_0_gemv q4_0_gemv_32 q4_0_gemv_subgroup; do
            glslangValidator -V --target-env vulkan1.1 -S comp \
              "native/shaders/${variant}.comp" \
              -o "app/src/main/assets/shaders/${variant}.spv"
            spirv-val --target-env vulkan1.1 "app/src/main/assets/shaders/${variant}.spv"
          done

      - name: Fetch pinned Arm KleidiAI (Apache-2.0)
        run: |
          bash scripts/fetch-kleidiai.sh

      - name: Fetch pinned llama.cpp with PLaMo3 GGUF support
        run: |
          bash scripts/fetch-llama.sh

      - name: Build release APK including real GGUF inference
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Validate ARM library and embedded shader
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libg2turbo.so"
          # The launcher must expose the new configurable real-GGUF sweep.
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" |
            grep -F 'dev.poteto.g2turbo.SweepBenchmarkActivity'
          for variant in q4_0_gemv q4_0_gemv_32 q4_0_gemv_subgroup; do
            unzip -l "$APK" | grep -F "assets/shaders/${variant}.spv"
          done
          mkdir -p dist
          cp "$APK" dist/g2-turbo-kernel-bench.apk
          (cd dist && sha256sum g2-turbo-kernel-bench.apk > SHA256SUMS.txt)

      - name: Public APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: g2-turbo-kernel-bench-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
